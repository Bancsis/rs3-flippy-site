<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RS3 Flippy</title>
<style>
:root{
  color-scheme:dark;
  --bg:#07101b;--panel:#0c1724;--panel2:#101d2b;--panel3:#142334;--rowA:#0d1825;--rowB:#101c29;
  --text:#f5f8fc;--muted:#91a4b9;--line:#24364a;--accent:#66b8ff;--accent2:#9ad2ff;--accentSoft:#122b42;
  --link:#67b9ff;--good:#2dcf73;--goodBg:#103e29;--amber:#ffd166;--amberBg:#4a3910;--bad:#ff7676;--badBg:#511e24;
  --focus:#8dd0ff;--input:#0e1b29;--shadow:rgba(0,0,0,.28);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#fff8e8;--panel:#fffdf7;--panel2:#fff8ed;--panel3:#fff1dc;--rowA:#fffdf8;--rowB:#fff8ee;
  --text:#2b241e;--muted:#75685d;--line:#e9d9c5;--accent:#e86f1c;--accent2:#b84d07;--accentSoft:#fff0dd;
  --link:#bf570d;--good:#18794e;--goodBg:#dff5e8;--amber:#8a6100;--amberBg:#fff0b8;--bad:#b42318;--badBg:#fee4e2;
  --focus:#f28a3b;--input:#fffaf2;--shadow:rgba(90,56,20,.10);
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.42 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}.app{width:min(1180px,calc(100% - 28px));margin:20px auto 50px}
.topbar{display:flex;align-items:center;gap:22px;margin-bottom:16px}.brand{font-size:24px;font-weight:800;letter-spacing:-.5px}.tabs{display:flex;align-self:stretch;gap:4px}.tab{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-bottom:2px solid transparent;font-weight:700}.tab.active{color:var(--accent2);border-color:var(--accent)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:12px}.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:8px 13px;font-weight:700}.btn:hover{border-color:var(--accent);background:var(--accentSoft)}.btn.primary{border-color:var(--accent);color:var(--accent2)}.updated{color:var(--muted);min-width:104px;text-align:right;display:flex;align-items:center;justify-content:flex-end}
.theme-toggle{width:46px;height:36px;border:1px solid var(--line);background:var(--panel2);border-radius:20px;display:grid;place-items:center;font-size:18px}.theme-toggle:hover{border-color:var(--accent)}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:10px;box-shadow:0 8px 26px var(--shadow);overflow:hidden}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;border-bottom:1px solid var(--line)}
.search-wrap{position:relative;min-width:230px;flex:1;max-width:380px}.search-wrap input,.field-inline input,.field-inline select,select,input[type="number"]{height:38px;border:1px solid var(--line);border-radius:7px;background:var(--input);padding:0 11px;outline:none}.search-wrap input{width:100%;padding-right:38px}.search-wrap input:focus,.field-inline input:focus,select:focus,input[type="number"]:focus{border-color:var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 22%,transparent)}
.clear-btn{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:transparent;color:var(--muted);font-size:18px;display:none;align-items:center;justify-content:center;border-radius:5px}.clear-btn.show{display:flex}.clear-btn:hover{background:var(--panel3);color:var(--text)}
.field-inline{display:flex;align-items:center;gap:7px;white-space:nowrap}.field-inline label{color:var(--muted);font-size:13px}.field-inline input{width:106px}.field-inline input.wide{width:132px}.risk-control{display:flex;align-items:center;gap:7px;margin-right:4px}.risk-control label{color:var(--muted);font-size:13px}.risk-control select{min-width:112px;padding:0 28px 0 10px}
.info{display:inline-grid;place-items:center;width:17px;height:17px;border:1px solid var(--line);border-radius:50%;font-size:11px;color:var(--muted);cursor:help;vertical-align:middle}.tooltip{position:fixed;z-index:1000;display:none;max-width:270px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel3);box-shadow:0 8px 24px var(--shadow);color:var(--text);font-size:12px;pointer-events:none}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:middle}th:last-child,td:last-child{border-right:0}th{background:var(--panel2);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;text-align:left}tbody tr.row-a{background:var(--rowA)}tbody tr.row-b{background:var(--rowB)}tbody tr:hover:not(.detail){background:var(--panel3)}.num{text-align:right;font-variant-numeric:tabular-nums}.center{text-align:center}.sort{border:0;background:transparent;padding:0;color:inherit;text-transform:inherit;letter-spacing:inherit;font-weight:800}.sort:hover{color:var(--text)}
.item-cell{display:flex;align-items:center;gap:10px;min-width:0}.item-icon{width:34px;height:34px;object-fit:contain;flex:0 0 34px}.item-main{min-width:0;display:flex;flex-direction:column;gap:2px}.item-main a{color:var(--link);text-decoration:none;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item-main a:hover{text-decoration:underline}.item-meta{font-size:12px;color:var(--muted)}.gp{color:var(--good);font-weight:750}.risk{display:inline-flex;align-items:center;justify-content:center;min-width:68px;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:800;text-transform:capitalize}.risk-green{background:var(--goodBg);color:var(--good)}.risk-amber{background:var(--amberBg);color:var(--amber)}.risk-red{background:var(--badBg);color:var(--bad)}
.footer-count{padding:9px 13px;color:var(--muted);font-size:12px;text-align:center;border-top:0}.empty{padding:28px!important;text-align:center;color:var(--muted)}
.methods-top{display:flex;flex-direction:column;gap:10px;padding:13px;border-bottom:1px solid var(--line)}.profile-row,.filter-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.profile-row input{height:38px;border:1px solid var(--line);border-radius:7px;background:var(--input);padding:0 11px;width:190px}.status-text{color:var(--muted);font-size:12px}.check{display:inline-flex;align-items:center;gap:7px;color:var(--muted);user-select:none}.check input{accent-color:var(--accent);width:16px;height:16px}.filter-row select{height:38px;min-width:138px}.filter-row .search-wrap{margin-left:auto;max-width:300px}
.manual{display:none;border-top:1px solid var(--line);padding:13px;background:var(--panel2)}.manual.open{display:block}.manual-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.skill-input{display:grid;grid-template-columns:24px 1fr 54px;align-items:center;gap:6px;color:var(--muted);font-size:12px}.skill-input img{width:21px;height:21px;object-fit:contain}.skill-input input{width:54px;height:32px;text-align:center;padding:0 4px;border:1px solid var(--line);border-radius:6px;background:var(--input)}.manual-actions{margin-top:10px}
.skill-cell{text-align:center}.skill-icon{width:25px;height:25px;object-fit:contain}.combat-icon{font-size:20px}.method-row{cursor:pointer}.method-row.open{background:var(--accentSoft)!important;box-shadow:inset 4px 0 0 var(--accent)}.method-name{font-weight:700;color:var(--text)}.variant{display:block;color:var(--muted);font-size:11px;margin-top:2px}.tag{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:5px;background:var(--panel3);border:1px solid var(--line);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}.tag.theoretical{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 55%,var(--line));background:color-mix(in srgb,var(--amberBg) 65%,var(--panel3))}.req-cell{white-space:normal;overflow-wrap:anywhere;line-height:1.3}.req-unmet{color:var(--bad);font-weight:650}.req-ok{color:var(--text)}
.detail td{padding:0;background:var(--panel)}.detail-panel{margin:10px 12px 14px;border:1px solid color-mix(in srgb,var(--accent) 32%,var(--line));border-radius:9px;background:var(--panel2);overflow:hidden;box-shadow:inset 0 1px 0 color-mix(in srgb,var(--accent) 10%,transparent)}.detail-head{display:flex;align-items:center;justify-content:flex-end;padding:8px 11px;border-bottom:1px solid var(--line)}.wiki-link{color:var(--link);font-weight:700;text-decoration:none;font-size:12px}.wiki-link:hover{text-decoration:underline}.detail-stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.detail-stat{padding:10px 12px;border-right:1px solid var(--line)}.detail-stat:last-child{border-right:0}.detail-stat-label{display:block;color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.04em;margin-bottom:3px}.detail-stat-value{font-size:16px;font-weight:750}.detail-body{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(220px,.8fr);gap:0}.detail-section{padding:13px}.detail-section+ .detail-section{border-left:1px solid var(--line)}.section-title{font-size:13px;font-weight:800;margin-bottom:10px}.steps{display:flex;flex-direction:column;gap:8px}.step{display:grid;grid-template-columns:25px 1fr;gap:9px;align-items:start}.step-num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--accentSoft);color:var(--accent2);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));font-size:11px;font-weight:800}.step-title{font-weight:700}.step-meta{color:var(--muted);font-size:12px;margin-top:2px}.req-block+.req-block{margin-top:12px}.req-title{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}.req-list{font-size:13px;line-height:1.55}.detail-note{padding:9px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.drops{width:100%;border:1px solid var(--line);border-radius:7px;overflow:hidden}.drops table{table-layout:fixed}.drops th,.drops td{padding:7px 9px;font-size:12px}.drops th{background:var(--panel3)}.drops .drop-name{color:var(--link)}.drops-note{color:var(--muted);font-size:12px;padding:8px 0}.mode-note{font-size:11px;color:var(--muted)}
@media(max-width:820px){.app{width:min(100% - 16px,1180px);margin-top:10px}.topbar{gap:10px;flex-wrap:wrap}.brand{font-size:20px}.top-actions{width:100%;margin-left:0;justify-content:flex-end}.controls{align-items:flex-start}.detail-stats{grid-template-columns:repeat(2,1fr)}.detail-stat:nth-child(2){border-right:0}.detail-body{grid-template-columns:1fr}.detail-section+.detail-section{border-left:0;border-top:1px solid var(--line)}.filter-row .search-wrap{margin-left:0}.methods-table{min-width:900px}.flip-table{min-width:800px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">RS3 Flippy</div>
    <nav class="tabs" aria-label="Sections"><button class="tab active" data-tab="flipping">Flipping</button><button class="tab" data-tab="methods">Methods</button></nav>
    <div class="top-actions"><button id="refresh" class="btn primary" type="button">↻ Refresh</button><span id="updated" class="updated">Not updated yet</span><button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch theme">☾</button></div>
  </header>

  <section id="flippingPage" class="page">
    <div class="panel">
      <div class="controls">
        <div class="search-wrap"><input id="flipSearch" type="search" placeholder="Search items…" autocomplete="off"><button class="clear-btn" type="button" data-clear="flipSearch" aria-label="Clear search">×</button></div>
        <div class="risk-control"><label for="riskFilter">Risk</label><select id="riskFilter"><option value="all">All risks</option><option value="green">Green</option><option value="amber">Amber</option><option value="red">Red</option></select></div>
        <div class="field-inline"><label for="cashM">Cash (m)</label><input id="cashM" type="text" value="2.5" inputmode="decimal" autocomplete="off"><span class="info" tabindex="0" data-tip="2.5 means 2.5 million GP.">?</span></div>
        <div class="field-inline"><label for="minVolume">Min volume/day</label><input id="minVolume" class="wide" type="text" value="" inputmode="numeric" autocomplete="off" placeholder="0"><span class="info" tabindex="0" data-tip="Hide items trading less than this each day. Blank or 0 means no filter.">?</span></div>
      </div>
      <div class="table-wrap">
        <table class="flip-table">
          <colgroup><col style="width:34%"><col style="width:10%"><col style="width:10%"><col style="width:12%"><col style="width:12%"><col style="width:12%"><col style="width:10%"></colgroup>
          <thead><tr>
            <th><button class="sort flip-sort" data-key="name">Item</button></th>
            <th class="num"><button class="sort flip-sort" data-key="buy">Buy</button><span class="info" tabindex="0" data-tip="Suggested price to place your buy offer.">?</span></th>
            <th class="num"><button class="sort flip-sort" data-key="sell">Sell</button><span class="info" tabindex="0" data-tip="Suggested price to place your sell offer.">?</span></th>
            <th class="num"><button class="sort flip-sort" data-key="profitEach">Profit each</button><span class="info" tabindex="0" data-tip="Profit on one item after GE tax.">?</span></th>
            <th class="num"><button class="sort flip-sort" data-key="profitPer4h">GP/4H</button><span class="info" tabindex="0" data-tip="Estimated profit in one 4-hour GE limit window, capped by cash, volume and GE limit.">?</span></th>
            <th class="num"><button class="sort flip-sort" data-key="volume">Volume/day</button><span class="info" tabindex="0" data-tip="Approximate number traded per day.">?</span></th>
            <th class="center"><button class="sort flip-sort" data-key="risk">Risk</button></th>
          </tr></thead>
          <tbody id="flipRows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
        </table>
      </div>
      <div id="flipCount" class="footer-count"></div>
    </div>
  </section>

  <section id="methodsPage" class="page" hidden>
    <div class="panel">
      <div class="methods-top">
        <div class="profile-row">
          <input id="rsName" type="text" placeholder="RuneScape name" autocomplete="off"><button id="lookup" class="btn primary" type="button">Lookup</button><button id="manualToggle" class="btn" type="button">Manual levels</button><span id="lookupStatus" class="status-text"></span>
        </div>
        <div class="filter-row">
          <select id="categoryFilter"><option value="all">All categories</option><option value="processing">Processing</option><option value="gathering">Gathering</option><option value="PvM">PvM</option></select>
          <select id="skillFilter"><option value="all">Any skill</option></select>
          <label class="check"><input id="eligibleOnly" type="checkbox"> Eligible only</label>
          <label class="check"><input id="geOnly" type="checkbox"> GE only</label>
          <div class="search-wrap"><input id="methodSearch" type="search" placeholder="Search methods…" autocomplete="off"><button class="clear-btn" type="button" data-clear="methodSearch" aria-label="Clear search">×</button></div>
        </div>
      </div>
      <div id="manualPanel" class="manual"><div id="manualGrid" class="manual-grid"></div><div class="manual-actions"><button id="applyLevels" class="btn primary" type="button">Apply levels</button></div></div>
      <div class="table-wrap">
        <table class="methods-table">
          <colgroup><col style="width:6%"><col style="width:27%"><col style="width:11%"><col style="width:11%"><col style="width:9%"><col style="width:9%"><col style="width:10%"><col style="width:17%"></colgroup>
          <thead><tr>
            <th class="center">Skill</th>
            <th><button class="sort method-sort" data-key="method">Method</button></th>
            <th><button class="sort method-sort" data-key="category">Category</button></th>
            <th class="num"><button class="sort method-sort" data-key="gpPerHour">GP/hour</button><span class="info" tabindex="0" data-tip="Estimated hourly profit after costs.">?</span></th>
            <th class="num"><button class="sort method-sort" data-key="roi">ROI</button><span class="info" tabindex="0" data-tip="Profit compared with consumed input cost. Permanent gear is not counted as an input.">?</span></th>
            <th class="num"><button class="sort method-sort" data-key="effort">Effort /10</button><span class="info" tabindex="0" data-tip="1 is very AFK. 10 needs constant attention. PvM can adjust using your combat levels.">?</span></th>
            <th class="num"><button class="sort method-sort" data-key="actionsPerMinute">Actions/min</button><span class="info" tabindex="0" data-tip="Estimated interactions per minute when the data is reliable.">?</span></th>
            <th><span>Requirements</span><span class="info" tabindex="0" data-tip="Minimum levels or quests needed to do the method.">?</span></th>
          </tr></thead>
          <tbody id="methodRows"><tr><td colspan="8" class="empty">Open Methods to load data.</td></tr></tbody>
        </table>
      </div>
      <div id="methodCount" class="footer-count"></div>
    </div>
  </section>
</div>
<div class="attribution" style="width:min(1180px,calc(100% - 28px));margin:0 auto 22px;color:var(--muted);font-size:11px;text-align:center">Data from <a href="https://runescape.wiki" target="_blank" rel="noopener" style="color:var(--link)">RuneScape Wiki</a> · CC BY-NC-SA 3.0 · Not affiliated with Jagex.</div>
<div id="tip" class="tooltip" role="tooltip"></div>
<script src="./config.js"></script>
<script type="module">
import { loadFlips as browserLoadFlips, loadMethods as browserLoadMethods, lookupPlayerBrowser, loadBossDrops as browserLoadBossDrops } from './src/app-service.js';
(()=>{
  const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const SKILLS=['Attack','Defence','Strength','Constitution','Ranged','Prayer','Magic','Cooking','Woodcutting','Fletching','Fishing','Firemaking','Crafting','Smithing','Mining','Herblore','Agility','Thieving','Slayer','Farming','Runecrafting','Hunter','Construction','Summoning','Dungeoneering','Divination','Invention','Archaeology','Necromancy'];
  const state={tab:'flipping',flips:[],methods:[],profile:null,manual:{},expanded:null,flipSort:{key:'profitPer4h',dir:'desc'},methodSort:{key:'gpPerHour',dir:'desc'},lastUpdated:{},loadingFlips:false,loadingMethods:false,bossDrops:new Map(),bossLoading:new Set()};
  const savedProfile=localStorage.getItem('rs3flippy:profile');if(savedProfile){try{state.profile=JSON.parse(savedProfile)}catch{}}
  const savedManual=localStorage.getItem('rs3flippy:manual');if(savedManual){try{state.manual=JSON.parse(savedManual)}catch{}}
  const savedCash=localStorage.getItem('rs3flippy:cashM');if(savedCash!==null)$('cashM').value=savedCash;
  const savedMinVol=localStorage.getItem('rs3flippy:minVolume');if(savedMinVol!==null)$('minVolume').value=savedMinVol;
  $('geOnly').checked=localStorage.getItem('rs3flippy:geOnly')==='1';
  if(localStorage.getItem('rs3flippy:theme')==='light')document.documentElement.dataset.theme='light';

  const bankrollM=()=>Math.max(0,Number(String($('cashM').value||'0').replace(',','.'))||0);
  const bankrollGp=()=>Math.floor(bankrollM()*1_000_000);
  const minVolume=()=>Math.max(0,Math.floor(Number(String($('minVolume').value||'0').replace(/,/g,''))||0));
  const compact=n=>{n=Number(n);if(!Number.isFinite(n))return'—';const a=Math.abs(n);if(a>=1e9)return`${(n/1e9).toFixed(a>=1e10?1:2).replace(/\.0+$/,'')}B`;if(a>=1e6)return`${(n/1e6).toFixed(a>=1e7?1:2).replace(/\.0+$/,'')}M`;if(a>=1e3)return`${(n/1e3).toFixed(a>=1e4?0:1).replace(/\.0$/,'')}K`;return Math.round(n).toLocaleString('en-GB')};
  const exact=n=>Number.isFinite(Number(n))?Math.round(Number(n)).toLocaleString('en-GB'):'—';
  const pct=n=>Number.isFinite(Number(n))?`${Number(n).toLocaleString('en-GB',{maximumFractionDigits:1})}%`:'—';
  const rate=n=>Number.isFinite(Number(n))&&Number(n)>0?Number(n).toLocaleString('en-GB',{maximumFractionDigits:2}):'—';
  const wikiUrl=page=>`https://runescape.wiki/w/${encodeURIComponent(String(page||'').replaceAll(' ','_'))}`;
  const itemIcon=name=>`https://runescape.wiki/w/Special:Redirect/file/${encodeURIComponent(String(name||'').replaceAll(' ','_')+'.png')}`;
  const skillIcon=skill=>skill&&skill!=='Combat'?`https://runescape.wiki/images/${encodeURIComponent(skill.replaceAll(' ','_'))}-icon.png`:'';
  const categoryLabel=x=>x==='processing'?'Processing':x==='gathering'?'Gathering':x==='PvM'?'PvM':x||'—';
  const profileParam=()=>state.profile?btoa(unescape(encodeURIComponent(JSON.stringify(state.profile)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''):'';

  function setTab(tab){state.tab=tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));$('flippingPage').hidden=tab!=='flipping';$('methodsPage').hidden=tab!=='methods';updateAge();if(tab==='methods'&&!state.methods.length)loadMethods()}
  function sortRows(rows,sort){return [...rows].sort((a,b)=>{let x=a[sort.key],y=b[sort.key];if(sort.key==='risk'){const m={green:1,amber:2,red:3};x=m[x]||9;y=m[y]||9}if(typeof x==='string'||typeof y==='string'){const c=String(x??'').localeCompare(String(y??''));return sort.dir==='asc'?c:-c}x=Number(x);y=Number(y);if(!Number.isFinite(x))x=sort.dir==='asc'?Infinity:-Infinity;if(!Number.isFinite(y))y=sort.dir==='asc'?Infinity:-Infinity;return sort.dir==='asc'?x-y:y-x})}
  function toggleClear(id){const input=$(id),btn=document.querySelector(`[data-clear="${id}"]`);if(btn)btn.classList.toggle('show',!!input.value)}

  function renderFlips(){
    const q=$('flipSearch').value.trim().toLowerCase(),risk=$('riskFilter').value;
    let rows=state.flips.filter(r=>(!q||String(r.name).toLowerCase().includes(q))&&(risk==='all'||r.risk===risk));rows=sortRows(rows,state.flipSort);
    $('flipRows').innerHTML=rows.length?rows.map((r,i)=>`<tr class="flip-row ${i%2?'row-b':'row-a'}"><td><div class="item-cell"><img class="item-icon" loading="lazy" src="${itemIcon(r.name)}" alt=""><div class="item-main"><a href="${wikiUrl(r.name)}" target="_blank" rel="noopener">${esc(r.name)}</a><span class="item-meta">Limit ${compact(r.geLimit)} · Can afford ${exact(r.youCanAfford)}</span></div></div></td><td class="num">${exact(r.buy)}</td><td class="num">${exact(r.sell)}</td><td class="num gp">${exact(r.profitEach)}</td><td class="num gp">${compact(r.profitPer4h)}</td><td class="num">${compact(r.volume)}</td><td class="center"><span class="risk risk-${esc(r.risk)}" tabindex="0" data-tip="${esc((r.riskReasons||[]).join(' • '))}">${esc(r.risk)}</span></td></tr>`).join(''):'<tr><td colspan="7" class="empty">No flips match these filters.</td></tr>';
    $('flipCount').textContent=`Showing ${rows.length.toLocaleString('en-GB')} ${rows.length===1?'opportunity':'opportunities'}`;toggleClear('flipSearch');wireTips();
  }

  function renderManual(){const levels={...(state.profile?.skills||{}),...state.manual};$('manualGrid').innerHTML=SKILLS.map(skill=>`<label class="skill-input"><img src="${skillIcon(skill)}" alt=""><span>${esc(skill)}</span><input data-skill="${esc(skill)}" type="number" min="1" max="120" value="${esc(levels[skill]??'')}"></label>`).join('')}
  function reqHtml(r){const text=r.eligibility?.requirementsText||'No level requirement';const unmet=(r.eligibility?.unmet||[]).length>0;return `<span class="${unmet?'req-unmet':'req-ok'}">${esc(text)}</span>`}
  function recommendedText(req){const parts=[...(req?.recommendedSkills||[]).map(x=>`${x.skill} ${x.level}+`),...(req?.recommendedQuests||[]).map(x=>x),...(req?.recommendedItems||[]).map(x=>x)];return parts.length?parts.join(' • '):'No separate recommendations listed.'}
  function hardText(req){const parts=[...(req?.skills||[]).map(x=>`${x.skill} ${x.level}`),...(req?.quests||[]),...(req?.items||[])];return parts.length?parts.join(' • '):'No minimum level requirement.'}

  function acquisitionSteps(acq,qty,steps,depth=0){
    if(!acq)return;
    for(const up of acq.upstream||[]){
      const q=Number(up.qtyPerCycle||0)*Math.max(1,Number(qty||1)/(Number(acq.outputQtyPerCycle||1)||1));
      if(up.acquisition&&up.source!=='Buy on GE')acquisitionSteps(up.acquisition,q,steps,depth+1);
      else steps.push({title:up.source==='Buy on GE'?`Buy ${fmtQty(q)} ${up.itemName} on the GE`:`Obtain ${fmtQty(q)} ${up.itemName}`,meta:`${compact(up.gpPerUnit)} GP each${up.summary?` · ${up.summary}`:''}`});
    }
    const time=Number(acq.effectiveSecondsPerCycle||0);
    steps.push({title:acq.summary||`Self-source ${acq.itemName}`,meta:`Produces ${fmtQty(acq.outputQtyPerCycle||qty||1)} · effective cost ${compact(acq.gpPerUnit)} GP each${time>0?` · about ${time.toFixed(1)} sec`:''}${acq.interactionSec>0?` · input about every ${Number(acq.interactionSec).toFixed(1)} sec`:''}`});
  }
  function fmtQty(n){n=Number(n);return Number.isFinite(n)?n.toLocaleString('en-GB',{maximumFractionDigits:3}):'—'}
  function methodSteps(r){const steps=[];(r.requiredItems||[]).forEach(i=>{if(i.sourceMode==='self'&&i.acquisition)acquisitionSteps(i.acquisition,i.qty,steps);else steps.push({title:i.sourceMode==='ge'?`Buy ${fmtQty(i.qty)} ${i.name} on the GE`:`Obtain ${fmtQty(i.qty)} ${i.name}`,meta:`${compact(i.gpPerUnit)} GP each · ${i.source}`})});steps.push({title:`Perform ${r.method}`,meta:r.output?`Produces ${r.outputQtyPerRun?`${fmtQty(r.outputQtyPerRun)} × `:''}${r.output}`:'Complete the method'});if(r.output&&r.patientSell)steps.push({title:`Sell ${r.output} on the GE`,meta:`Suggested patient sell: ${exact(r.patientSell)} GP each`});return steps}
  function statProfit(r){if(Number.isFinite(Number(r.profitPerItem)))return['Profit per item',`${compact(r.profitPerItem)} gp`];if(Number.isFinite(Number(r.profitPerRun)))return['Profit per action',`${compact(r.profitPerRun)} gp`];return['GP/hour',compact(r.gpPerHour)]}
  function statSell(r){return r.patientSell?`${exact(r.patientSell)} gp`:'—'}
  function statInput(r){return Number(r.interactionSec)>0?`Every ${Number(r.interactionSec).toFixed(Number(r.interactionSec)<10?1:0)} sec`:'—'}

  async function ensureBossDrops(r){if(!r.bossPage||state.bossDrops.has(r.id)||state.bossLoading.has(r.id))return;state.bossLoading.add(r.id);try{const body=await browserLoadBossDrops({page:r.bossPage,method:r.method});state.bossDrops.set(r.id,body)}catch(e){state.bossDrops.set(r.id,{drops:[],error:e?.message||'Could not load drops'})}finally{state.bossLoading.delete(r.id);if(state.expanded===r.id)renderMethods()}}
  function bossDropsHtml(r){const d=state.bossDrops.get(r.id);if(!d){ensureBossDrops(r);return'<div class="drops-note">Loading meaningful drop data from the RuneScape Wiki…</div>'}if(!d.drops?.length)return`<div class="drops-note">${esc(d.error||d.note||'No reliable meaningful drop-rate table was found for this method.')}</div>`;return `<div class="drops"><table><colgroup><col style="width:40%"><col style="width:22%"><col style="width:20%"><col style="width:18%"></colgroup><thead><tr><th>Item</th><th class="num">Value</th><th class="num">Chance</th><th class="num">Rate</th></tr></thead><tbody>${d.drops.map(x=>`<tr><td class="drop-name">${esc(x.name)}</td><td class="num">${compact(x.value)}</td><td class="num">${Number(x.percent).toLocaleString('en-GB',{maximumFractionDigits:3})}%</td><td class="num">${esc(x.rate)}</td></tr>`).join('')}</tbody></table></div><div class="drops-note">Meaningful drops only · source: RuneScape Wiki. GP/hour still uses the Wiki money-making-guide value.</div>`}

  function expandedHtml(r){const [pl,pv]=statProfit(r);const source=r.wikiPublished?'RuneScape Wiki hourly profit':r.economicsSource||'Pathfinder sourcing model';const left=r.category==='PvM'?`<div class="section-title">Boss drops</div>${bossDropsHtml(r)}`:`<div class="section-title">How it works</div><div class="steps">${methodSteps(r).map((s,i)=>`<div class="step"><span class="step-num">${i+1}</span><div><div class="step-title">${esc(s.title)}</div><div class="step-meta">${esc(s.meta)}</div></div></div>`).join('')}</div>`;return `<tr class="detail"><td colspan="8"><div class="detail-panel"><div class="detail-head"><a class="wiki-link" href="${wikiUrl(r.wikiPage)}" target="_blank" rel="noopener">Wiki ↗</a></div><div class="detail-stats"><div class="detail-stat"><span class="detail-stat-label">${esc(pl)}</span><span class="detail-stat-value gp">${esc(pv)}</span></div><div class="detail-stat"><span class="detail-stat-label">Input interval</span><span class="detail-stat-value">${esc(statInput(r))}</span></div><div class="detail-stat"><span class="detail-stat-label">Sell</span><span class="detail-stat-value">${esc(statSell(r))}</span></div><div class="detail-stat"><span class="detail-stat-label">ROI</span><span class="detail-stat-value">${pct(r.roi)}</span></div></div><div class="detail-body"><div class="detail-section">${left}</div><div class="detail-section"><div class="req-block"><div class="req-title">Minimum requirements</div><div class="req-list">${esc(hardText(r.requirements))}</div></div><div class="req-block"><div class="req-title">Recommended</div><div class="req-list">${esc(recommendedText(r.requirements))}</div></div><div class="req-block"><div class="req-title">Effort estimate</div><div class="req-list">${esc(r.effortBasis||'Estimated from available data.')}</div></div></div></div><div class="detail-note">Profit source: ${esc(source)}.${r.theoretical?' This method is marked theoretical/ideal-condition by the underlying Pathfinder data.':''}</div></div></td></tr>`}

  function renderMethods(){
    const q=$('methodSearch').value.trim().toLowerCase(),cat=$('categoryFilter').value,skill=$('skillFilter').value,eligible=$('eligibleOnly').checked;
    let rows=state.methods.filter(r=>(!q||`${r.method} ${r.output||''}`.toLowerCase().includes(q))&&(cat==='all'||r.category===cat)&&(skill==='all'||r.primarySkill===skill)&&(!eligible||r.eligibility?.eligible===true));rows=sortRows(rows,state.methodSort);
    const html=[];rows.forEach((r,i)=>{const open=state.expanded===r.id,skillName=r.primarySkill||'';html.push(`<tr class="method-row ${i%2?'row-b':'row-a'} ${open?'open':''}" data-expand="${esc(r.id)}" tabindex="0" role="button" aria-expanded="${open}"><td class="skill-cell">${skillName==='Combat'?'<span class="combat-icon" title="Combat">⚔</span>':skillName==='General'?`<img class="skill-icon" src="${itemIcon('Coins')}" alt="General" title="General / no primary skill">`:skillName?`<img class="skill-icon" src="${skillIcon(skillName)}" alt="${esc(skillName)}" title="${esc(skillName)}">`:'—'}</td><td><span class="method-name">${esc(r.method)}</span>${r.variant?`<span class="variant">${esc(r.variant)}</span>`:''}${r.theoretical?'<span class="tag theoretical">Theoretical</span>':''}</td><td>${esc(categoryLabel(r.category))}</td><td class="num gp">${compact(r.gpPerHour)}</td><td class="num">${pct(r.roi)}</td><td class="num"><span tabindex="0" data-tip="${esc(r.effortBasis||'Estimated effort.')}">${Math.max(1,Math.min(10,Math.round(Number(r.effort)||5)))}</span></td><td class="num">${rate(r.actionsPerMinute)}</td><td class="req-cell">${reqHtml(r)}</td></tr>`);if(open)html.push(expandedHtml(r))});
    $('methodRows').innerHTML=html.length?html.join(''):'<tr><td colspan="8" class="empty">No methods match these filters.</td></tr>';$('methodCount').textContent=`Showing ${rows.length.toLocaleString('en-GB')} ${rows.length===1?'method':'methods'}`;
    document.querySelectorAll('.method-row').forEach(row=>{const toggle=()=>{const id=row.dataset.expand;state.expanded=state.expanded===id?null:id;renderMethods()};row.addEventListener('click',toggle);row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})});toggleClear('methodSearch');wireTips();
  }

  function ageText(ts){if(!ts)return'Not updated yet';const sec=Math.max(0,Math.floor((Date.now()-ts)/1000));if(sec<10)return'Updated just now';if(sec<60)return`Updated ${sec}s ago`;const min=Math.floor(sec/60);if(min<60)return`Updated ${min}m ago`;return`Updated ${Math.floor(min/60)}h ago`}
  function updateAge(){$('updated').textContent=ageText(state.lastUpdated[state.tab])}function setUpdated(tab,ts){state.lastUpdated[tab]=Number(ts)||Date.now();updateAge()}
  function setBusy(v){$('refresh').disabled=v;$('refresh').textContent=v?'↻ Updating…':'↻ Refresh'}

  async function loadFlips(force=false){if(state.loadingFlips)return;state.loadingFlips=true;setBusy(true);$('updated').textContent='Updating…';try{const body=await browserLoadFlips({bankroll:bankrollGp(),minVolume:minVolume(),force});state.flips=body.rows||[];setUpdated('flipping',body.updatedAt);renderFlips()}catch(e){$('updated').textContent='Update failed';$('flipRows').innerHTML=`<tr><td colspan="7" class="empty">${esc(e?.message||'Could not load live prices.')}</td></tr>`}finally{state.loadingFlips=false;setBusy(false)}}
  async function loadMethods(force=false){if(state.loadingMethods)return;state.loadingMethods=true;setBusy(true);$('updated').textContent='Updating…';try{const body=await browserLoadMethods({profile:state.profile,geOnly:$('geOnly').checked,force});state.methods=body.rows||[];state.expanded=null;setUpdated('methods',body.updatedAt);renderMethods()}catch(e){$('updated').textContent='Update failed';$('methodRows').innerHTML=`<tr><td colspan="8" class="empty">${esc(e?.message||'Could not load methods.')}</td></tr>`}finally{state.loadingMethods=false;setBusy(false)}}
  async function lookup(){const name=$('rsName').value.trim();if(!name)return;$('lookup').disabled=true;$('lookupStatus').textContent='Looking up…';try{const body=await lookupPlayerBrowser(name);state.profile={skills:body.levels||{},quests:body.quests??null};state.manual={...state.profile.skills};localStorage.setItem('rs3flippy:profile',JSON.stringify(state.profile));localStorage.setItem('rs3flippy:manual',JSON.stringify(state.manual));renderManual();$('lookupStatus').textContent=`Levels loaded from ${body.source}.`;await loadMethods()}catch(e){$('lookupStatus').textContent=e?.message||String(e);renderManual();$('manualPanel').classList.add('open')}finally{$('lookup').disabled=false}}
  function applyManual(){const skills={};document.querySelectorAll('#manualGrid [data-skill]').forEach(inp=>{const n=Math.max(1,Math.min(120,Number(inp.value||1)));skills[inp.dataset.skill]=Math.floor(n)});state.manual=skills;state.profile={skills,quests:state.profile?.quests??null};localStorage.setItem('rs3flippy:manual',JSON.stringify(skills));localStorage.setItem('rs3flippy:profile',JSON.stringify(state.profile));$('lookupStatus').textContent='Manual levels applied.';loadMethods()}
  function populateSkillFilter(){$('skillFilter').innerHTML='<option value="all">Any skill</option>'+[...SKILLS,'Combat','General'].map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}

  const tip=$('tip');let tipTarget=null;function showTip(el){const text=el.dataset.tip;if(!text)return;tipTarget=el;tip.textContent=text;tip.style.display='block';const r=el.getBoundingClientRect(),tr=tip.getBoundingClientRect();tip.style.left=`${Math.min(innerWidth-tr.width-8,Math.max(8,r.left+r.width/2-tr.width/2))}px`;let top=r.bottom+7;if(top+tr.height>innerHeight-8)top=r.top-tr.height-7;tip.style.top=`${Math.max(8,top)}px`}function hideTip(el){if(!el||tipTarget===el){tip.style.display='none';tipTarget=null}}function wireTips(){document.querySelectorAll('[data-tip]:not([data-tip-wired])').forEach(el=>{el.dataset.tipWired='1';el.addEventListener('mouseenter',()=>showTip(el));el.addEventListener('mouseleave',()=>hideTip(el));el.addEventListener('focus',()=>showTip(el));el.addEventListener('blur',()=>hideTip(el))})}

  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));$('refresh').addEventListener('click',()=>state.tab==='flipping'?loadFlips(true):loadMethods(true));
  $('cashM').addEventListener('change',()=>{localStorage.setItem('rs3flippy:cashM',$('cashM').value);loadFlips()});$('minVolume').addEventListener('change',()=>{localStorage.setItem('rs3flippy:minVolume',$('minVolume').value);loadFlips()});$('flipSearch').addEventListener('input',renderFlips);$('riskFilter').addEventListener('change',renderFlips);
  document.querySelectorAll('.flip-sort').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.key;state.flipSort=state.flipSort.key===k?{key:k,dir:state.flipSort.dir==='desc'?'asc':'desc'}:{key:k,dir:k==='name'?'asc':'desc'};renderFlips()}));document.querySelectorAll('.method-sort').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.key;state.methodSort=state.methodSort.key===k?{key:k,dir:state.methodSort.dir==='desc'?'asc':'desc'}:{key:k,dir:['method','category'].includes(k)?'asc':'desc'};renderMethods()}));
  ['categoryFilter','skillFilter','eligibleOnly'].forEach(id=>$(id).addEventListener('change',renderMethods));$('methodSearch').addEventListener('input',renderMethods);$('geOnly').addEventListener('change',()=>{localStorage.setItem('rs3flippy:geOnly',$('geOnly').checked?'1':'0');loadMethods()});$('lookup').addEventListener('click',lookup);$('rsName').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});$('manualToggle').addEventListener('click',()=>{renderManual();$('manualPanel').classList.toggle('open')});$('applyLevels').addEventListener('click',applyManual);
  document.querySelectorAll('[data-clear]').forEach(btn=>btn.addEventListener('click',()=>{const input=$(btn.dataset.clear);input.value='';input.focus();input.dispatchEvent(new Event('input',{bubbles:true}))}));
  function paintTheme(){const light=document.documentElement.dataset.theme==='light';$('themeToggle').textContent=light?'☀':'☾';$('themeToggle').setAttribute('aria-label',light?'Switch to dark mode':'Switch to light mode')}$('themeToggle').addEventListener('click',()=>{const light=document.documentElement.dataset.theme==='light';if(light)delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme='light';localStorage.setItem('rs3flippy:theme',light?'dark':'light');paintTheme()});
  window.addEventListener('scroll',()=>hideTip(),{passive:true});window.addEventListener('resize',()=>hideTip());window.addEventListener('rs3flippy:history-ready',()=>{if(state.tab==='flipping')loadFlips();});populateSkillFilter();renderManual();paintTheme();wireTips();setInterval(updateAge,5000);loadFlips();
})();
</script>
</body>
</html>
